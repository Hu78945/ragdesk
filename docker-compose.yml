services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragdesk
      POSTGRES_PASSWORD: ragdesk
      POSTGRES_DB: ragdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragdesk"]
      interval: 2s
      retries: 15

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://ragdesk:ragdesk@db:5432/ragdesk
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      RERANK: ${RERANK:-1}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:

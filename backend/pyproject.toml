[project]
name = "ragdesk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.7.0",
    "fastapi>=0.162.2",
    "fastembed>=0.9.1",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pypdf>=7.0.0",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pgserver>=0.1.4",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
extend-exclude = [".pgdata"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM905", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"eval/golden.py" = ["E501"]  # one question per line reads better than wrapped dicts
